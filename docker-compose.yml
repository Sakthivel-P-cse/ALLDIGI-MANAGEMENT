version: '3'

services:
  db:
    image: mariadb:11.4.7
    container_name: snipeit_db_unified
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-snipeit}
      MARIADB_USER: ${DB_USERNAME:-snipeit}
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme1234}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data_unified:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 2s
      retries: 10

  api:
    build:
      context: ./backend/SnipeIt.Api
      dockerfile: Dockerfile
    container_name: snipeit_api_unified
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: server=db;port=3306;database=${DB_DATABASE:-snipeit};user=${DB_USERNAME:-snipeit};password=${DB_PASSWORD:-changeme1234}
      Jwt__Key: ${JWT_KEY:-ThisIsASuperSecretKeyForSnipeItApi123!}
      Jwt__Issuer: ${JWT_ISSUER:-SnipeItApi}
      Jwt__Audience: ${JWT_AUDIENCE:-SnipeItUi}
      Seed__TestUserPassword: ${SEED_TEST_USER_PASSWORD:-Test123!}
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snipeit_frontend_unified
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  db_data_unified:
