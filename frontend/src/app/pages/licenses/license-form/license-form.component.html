<div class="header-actions">
  <h2>{{ pageTitle }}</h2>
</div>

<div *ngIf="error" class="error-banner">
  {{ error }}
</div>

<div class="card">
  <form [formGroup]="licenseForm" (ngSubmit)="onSubmit()">
    <div class="grid">
      <div class="form-group">
        <label for="name">License Name *</label>
        <input id="name" type="text" class="form-control" formControlName="name" placeholder="E.g. Office 365">
      </div>
      
      <div class="form-group">
        <label for="serial">Serial Number / Product Key</label>
        <input id="serial" type="text" class="form-control" formControlName="serial" placeholder="XXXX-XXXX-XXXX-XXXX">
      </div>
      
      <div class="form-group">
        <label for="seats">Total Seats *</label>
        <input id="seats" type="number" class="form-control" formControlName="seats">
      </div>

      <div class="form-group">
        <label for="purchaseCost">Purchase Cost</label>
        <input id="purchaseCost" type="number" step="0.01" class="form-control" formControlName="purchaseCost">
      </div>
    </div>
    
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">CANCEL</button>
      <button type="submit" class="btn btn-cyan" [disabled]="licenseForm.invalid || loading">
        {{ loading ? 'SAVING...' : buttonText }}
      </button>
    </div>
  </form>
</div>
