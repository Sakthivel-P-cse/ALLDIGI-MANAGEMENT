<div class="page-header flex-between mb-4">
  <div>
    <h2>{{ pageTitle }}</h2>
    <p class="text-muted">Fill out the details below to save the asset record.</p>
  </div>
</div>

<div *ngIf="error" class="alert alert-error mb-3">
  <mat-icon>error</mat-icon>
  {{ error }}
</div>

<mat-card class="form-card">
  <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>
  
  <form [formGroup]="assetForm" (ngSubmit)="onSubmit()">
    <mat-card-header>
      <mat-card-title>Asset Information</mat-card-title>
    </mat-card-header>
    
    <mat-divider></mat-divider>
    
    <mat-card-content class="pt-4">
      <div class="grid form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Asset Tag</mat-label>
          <input matInput formControlName="assetTag" placeholder="E.g. ASSET-001">
          <mat-error *ngIf="assetForm.get('assetTag')?.hasError('required')">
            Asset Tag is required
          </mat-error>
        </mat-form-field>
        
        <mat-form-field appearance="outline">
          <mat-label>Asset Name</mat-label>
          <input matInput formControlName="name" placeholder="E.g. MacBook Pro">
          <mat-error *ngIf="assetForm.get('name')?.hasError('required')">
            Asset Name is required
          </mat-error>
        </mat-form-field>
        
        <mat-form-field appearance="outline">
          <mat-label>Model ID</mat-label>
          <input matInput type="number" formControlName="modelId">
          <mat-error *ngIf="assetForm.get('modelId')?.hasError('required')">
            Model ID is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Serial Number</mat-label>
          <input matInput formControlName="serial" placeholder="Hardware Serial">
        </mat-form-field>
        
        <mat-form-field appearance="outline">
          <mat-label>Status ID</mat-label>
          <input matInput type="number" formControlName="statusId">
        </mat-form-field>
      </div>
      
      <div class="full-width mt-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Notes</mat-label>
          <textarea matInput formControlName="notes" rows="4" placeholder="Additional details or remarks..."></textarea>
        </mat-form-field>
      </div>
    </mat-card-content>

    <mat-divider></mat-divider>

    <mat-card-actions align="end" class="pa-3">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="assetForm.invalid || loading">
        <mat-icon *ngIf="!loading">save</mat-icon>
        {{ loading ? 'Saving...' : buttonText }}
      </button>
    </mat-card-actions>
  </form>
</mat-card>
