<div class="header-actions">
  <h2>{{ pageTitle }}</h2>
</div>

<div *ngIf="error" class="error-banner">
  {{ error }}
</div>

<div class="card">
  <form [formGroup]="accessoryForm" (ngSubmit)="onSubmit()">
    <div class="grid">
      <div class="form-group">
        <label for="name">Accessory Name *</label>
        <input id="name" type="text" class="form-control" formControlName="name" placeholder="E.g. Apple Magic Mouse">
      </div>
      
      <div class="form-group">
        <label for="qty">Quantity *</label>
        <input id="qty" type="number" class="form-control" formControlName="qty">
      </div>
      
      <div class="form-group">
        <label for="locationId">Location ID</label>
        <input id="locationId" type="number" class="form-control" formControlName="locationId">
      </div>
    </div>
    
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">CANCEL</button>
      <button type="submit" class="btn btn-cyan" [disabled]="accessoryForm.invalid || loading">
        {{ loading ? 'SAVING...' : buttonText }}
      </button>
    </div>
  </form>
</div>
