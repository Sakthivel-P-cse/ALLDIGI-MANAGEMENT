<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Manufacturers</h2>
    <button class="btn btn-primary" routerLink="/manufacturers/new" *ngIf="isAdmin">
      <i class="bi bi-plus"></i> Create New
    </button>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Created At</th>
              <th *ngIf="isAdmin">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of items">
              <td>{{ item.id }}</td>
              <td>{{ item.name }}</td>
              <td>{{ item.createdAt | date }}</td>
              <td *ngIf="isAdmin">
                <button class="btn btn-sm btn-outline-primary me-2" [routerLink]="['/manufacturers', item.id, 'edit']">
                  Edit
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteItem(item.id)">
                  Delete
                </button>
              </td>
            </tr>
            <tr *ngIf="!loading && items.length === 0">
              <td colspan="4" class="text-center">No manufacturers found.</td>
            </tr>
            <tr *ngIf="loading">
              <td colspan="4" class="text-center">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
